name: Release RouterTasks

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 打包版本标签（须与所选分支或标签的插件版本一致，留空自动读取）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Create archive and index
        id: package
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          $tag = if ($env:EVENT_TAG) { $env:EVENT_TAG } else { $env:INPUT_TAG }
          if ($tag) {
            ./package-release.ps1 -Tag $tag -OutputDirectory ./artifacts/release
          } else {
            ./package-release.ps1 -OutputDirectory ./artifacts/release
          }
          $index = Get-Content -LiteralPath ./artifacts/release/release-index.json -Raw | ConvertFrom-Json
          "tag=$($index.tag)" >> $env:GITHUB_OUTPUT
      - name: Validate package metadata
        shell: pwsh
        run: |
          $index = Get-Content -LiteralPath ./artifacts/release/release-index.json -Raw | ConvertFrom-Json
          if ($index.schemaVersion -ne 1 -or $index.plugins.Count -ne 1 -or
              $index.plugins[0].id -cne 'router-tasks' -or $index.plugins[0].asset -cne 'router-tasks.zip') {
            throw 'Release index is invalid.'
          }
          if (-not (Test-Path -LiteralPath ./artifacts/release/router-tasks.zip) -or
              -not (Test-Path -LiteralPath ./artifacts/release/router-tasks.zip.sha256) -or
              -not (Test-Path -LiteralPath ./artifacts/release/release-notes.md)) {
            throw 'Release files are incomplete.'
          }
      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: router-tasks-${{ steps.package.outputs.tag }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: router-tasks-${{ needs.build.outputs.tag }}
          path: artifacts/release
      - name: Publish GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/release/router-tasks.zip \
            artifacts/release/router-tasks.zip.sha256 \
            artifacts/release/release-index.json \
            --verify-tag --title "RouterTasks $RELEASE_TAG" \
            --notes-file artifacts/release/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false
